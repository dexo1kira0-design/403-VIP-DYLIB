name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-path: ${{ github.workspace }}/theos

      - name: Build Package
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Dylib
          path: .theos/obj/debug/*.dylib
